name: CI

# Runs in rakay-technology/kraft-ci (PUBLIC repo, unlimited free minutes).
# Builds + tests the PRIVATE rakay-technology/kraft at a given ref.
# Nothing is published from here and no release is stored here.
#
# Two ways in, both producing the same jobs:
#
#   · workflow_dispatch   `-f ref=<branch|tag|sha>` — how scripts/release.ts
#                         dispatches it before a release (unchanged), and the
#                         manual escape hatch.
#   · repository_dispatch type `kraft-ci`, client_payload.sha — fired by
#                         .github/workflows/ci-dispatch.yml in the PRIVATE repo
#                         on every push and pull_request.
#
# WHY the dispatch is a separate step in the private repo rather than triggers
# here: the code lives in kraft (private), so CI has to check it OUT. Checking a
# private repo out from a private workflow burns private-repo minutes for the
# whole matrix; dispatching to this public repo does not. The private repo's
# ci-dispatch.yml also AWAITS the status this workflow posts back (see the
# `report` job), so the check on the PR reflects the real result instead of
# "the dispatch fired".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of rakay-technology/kraft to validate (default: main)"
        required: false
        type: string
        default: main
  repository_dispatch:
    types: [kraft-ci]

concurrency:
  # One run per ref. A force-push supersedes the previous run for that ref.
  group: ci-${{ github.event.inputs.ref || github.event.client_payload.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job checks out the private kraft at the ref that was asked for. The
  # expression is duplicated rather than hoisted into `env` because the `env`
  # context is not reliably available inside `steps.with` for actions/checkout.
  typecheck:
    name: Typecheck (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the repo's toolchain (.bun-version / packageManager).
          # Never `latest`: Bun 1.4.x rewrites bun.lock metadata.
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `turbo run lint --filter=!@repo/email` — EVERY workspace that declares
      # `lint: tsc --noEmit`, not just apps/api + apps/dashboard.
      #
      # This is the whole point of the change. `tsc` follows imports, so
      # apps/api's lint does drag in packages/{core,db,adapters}; but nothing
      # ever reached apps/cli, apps/desktop or apps/web. That gap was live:
      # apps/web failed `tsc --noEmit` outright (`Cannot find module
      # '@/.source/server'` — fumadocs-mdx output that was never generated
      # before lint) and nobody noticed because no pipeline ran it.
      - name: Typecheck every workspace
        run: bun run lint

  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # AGENTS.md mandates `bun format` before a PR but nothing enforced it.
      # --check fails instead of rewriting, so a red run means "run bun format".
      - name: prettier --check
        run: bunx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs `turbo run test` → vitest across every package that defines a test
      # script (@repo/core, @repo/adapters, @repo/db [PGlite — no external DB],
      # apps/api, apps/dashboard). Packages resolve to src, so no build needed.
      # apps/api excludes test/e2e/** here — those need a daemon and run in the
      # e2e-docker job in release-gate.yml, where they gate the publish.
      #
      # This also carries the repo-integrity guards that used to run nowhere:
      # packages/db's snapshot-chain suite (the drizzle tail snapshot must match
      # src/schema) and the dashboard's i18n parity ratchet.
      - name: Run tests
        run: bun run test

  webmail-server-test:
    name: Test webmail server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-webmail-${{ hashFiles('apps/email/server/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-webmail-
            ${{ runner.os }}-bun-

      # Not --frozen-lockfile: the committed lockfile can legitimately lag the
      # manifest here. Resolving fresh is fine for a test-only install.
      - name: Install webmail server dependencies
        working-directory: apps/email/server
        run: bun install

      - name: Run webmail server tests
        working-directory: apps/email/server
        run: bun test

  # Vendored agent skills are triplicated across .agents / .claude /
  # .commandcode with nothing checking they agree. scripts/check-skills.mjs
  # asserts each copy matches skills-lock.json AND that all copies are
  # byte-identical. It is not a workspace test, so it gets its own job.
  skills:
    name: Vendored skills agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          token: ${{ secrets.KRAFT_PAT }}
      - name: Check skills
        run: node scripts/check-skills.mjs

  # Post the outcome back to the private repo so the commit — and therefore the
  # PR that heads it — shows the real result. `always()` so a failure reports
  # too; a silent job would leave the PR with no kraft-ci check at all, which
  # is worse than a red one.
  report:
    name: Report to kraft
    needs: [typecheck, format, test, webmail-server-test, skills]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post commit status
        env:
          GH_TOKEN: ${{ secrets.KRAFT_PAT }}
          # A raw ref, not necessarily a SHA: workflow_dispatch carries a
          # branch/tag/sha string, repository_dispatch carries a real SHA. The
          # statuses API only accepts an object ID, so resolve it either way.
          RAW_REF: ${{ github.event.inputs.ref || github.event.client_payload.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/rakay-technology/kraft/commits/${RAW_REF}" --jq '.sha' 2>/dev/null || echo '')"
          if [ -z "${SHA}" ]; then
            # Nothing to attach the status to (an unpushed branch, a deleted
            # ref). The jobs above already reported their own result — this
            # step is only the PR-facing summary, so it must not fail the run.
            echo "::notice::cannot resolve '${RAW_REF}' to a kraft commit — skipping the status."
            exit 0
          fi
          echo "reporting to kraft ${SHA} (${RAW_REF})"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            state=failure
            desc="one or more CI jobs failed"
          elif [ "${{ contains(needs.*.result, 'success') }}" = "true" ] &&
               [ "$(echo '${{ join(needs.*.result, ',') }}' | grep -cv '^success$' || true)" = "0" ]; then
            state=success
            desc="typecheck + format + test + skills passed"
          else
            state=pending
            desc="no conclusive result — inspect the run"
          fi
          echo "→ kraft $SHA: $state ($desc)"
          gh api "repos/rakay-technology/kraft/statuses/${SHA}" \
            -f state="${state}" \
            -f context="kraft-ci" \
            -f description="${desc}" \
            -f target_url="${RUN_URL}" \
            --silent
