name: Release gate

# The tests that must pass before anything ships, running in
# rakay-technology/kraft-ci (PUBLIC repo) against the PRIVATE
# rakay-technology/kraft at a given ref: the unit/integration suite, and the
# real-daemon E2E matrix. If either goes red, the release does not publish.

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch or SHA of rakay-technology/kraft to gate"
        required: false
        type: string
        default: main
    secrets:
      KRAFT_PAT:
        description: "Token with read access to the private rakay-technology/kraft"
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA of rakay-technology/kraft to gate (default: main)"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck apps/api
        run: bun run --cwd apps/api lint

      - name: Run tests
        run: bun run test

  e2e-docker:
    name: E2E (real Docker, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: [fast, heavy]
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the Docker daemon
        run: |
          docker info
          docker version

      - name: Run real-daemon E2E
        env:
          RUN_DOCKER_E2E: "1"
          E2E_SCOPE: ${{ matrix.scope }}
        run: bun run --cwd apps/api test:e2e
