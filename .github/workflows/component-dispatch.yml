name: Component dispatch

# Manual fast lane in rakay-technology/kraft-ci (PUBLIC repo, unlimited free
# minutes): validate ONE component of the PRIVATE rakay-technology/kraft
# without running the whole pipeline. Nothing is published from here.
#
# Matrix (invalid combinations fail fast with the valid list):
#   lint   → api dashboard cli desktop web email core adapters db ui onboarding
#   test   → api dashboard cli desktop core adapters db (+ email = bun test server)
#   build  → api dashboard cli desktop email web
#            (core/adapters/db/ui/onboarding resolve to source — nothing to build)
#   docker → api dashboard edge mail webmail (build only, never pushed)
#   e2e-*  → api only (real daemon; same suites the release gate runs)

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Component to validate"
        required: true
        type: choice
        options:
          - api
          - dashboard
          - cli
          - desktop
          - email
          - web
          - core
          - adapters
          - db
          - ui
          - onboarding
          - edge
          - mail
          - webmail
      task:
        description: "Task to run (desktop build takes 7-20 min; prefer lint/test for iteration)"
        required: true
        type: choice
        options:
          - lint
          - test
          - build
          - docker
          - e2e-fast
          - e2e-heavy
          - e2e-update
      ref:
        description: "Branch, tag or SHA of rakay-technology/kraft (default: main)"
        required: false
        type: string
        default: main
      old_version:
        description: "Only for e2e-update: release to upgrade FROM (default: newest v* tag, skipped when none is pullable)"
        required: false
        type: string
      new_api_image:
        description: "Only for e2e-update: api image for the NEW side (default: build this checkout)"
        required: false
        type: string

concurrency:
  group: dispatch-${{ inputs.ref }}-${{ inputs.component }}-${{ inputs.task }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ inputs.component }}
    if: inputs.task == 'lint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint one component
        run: |
          set -euo pipefail
          case "${{ inputs.component }}" in
            api)         bun run --cwd apps/api lint ;;
            dashboard)   bun run --cwd apps/dashboard lint ;;
            cli)         bun run --cwd apps/cli lint ;;
            desktop)     bun run --cwd apps/desktop lint ;;
            web)         bun run --cwd apps/web lint ;;
            email)       bun run --cwd apps/email lint ;;
            core)        bun run --cwd packages/core lint ;;
            adapters)    bun run --cwd packages/adapters lint ;;
            db)          bun run --cwd packages/db lint ;;
            ui)          bun run --cwd packages/ui lint ;;
            onboarding)  bun run --cwd packages/onboarding lint ;;
            *) echo "::error::task=lint supports: api dashboard cli desktop web email core adapters db ui onboarding (got '${{ inputs.component }}')" ; exit 1 ;;
          esac

  test:
    name: Test ${{ inputs.component }}
    if: inputs.task == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: inputs.component != 'email'
        run: bun install --frozen-lockfile

      - name: Test webmail server (bun test)
        if: inputs.component == 'email'
        working-directory: apps/email/server
        run: |
          set -euo pipefail
          bun install
          bun test

      - name: Test one workspace (vitest)
        if: inputs.component != 'email'
        run: |
          set -euo pipefail
          case "${{ inputs.component }}" in
            api)       bun run --cwd apps/api test ;;
            dashboard) bun run --cwd apps/dashboard test ;;
            cli)       bun run --cwd apps/cli test ;;
            desktop)   bun run --cwd apps/desktop test ;;
            core)      bun run --cwd packages/core test ;;
            adapters)  bun run --cwd packages/adapters test ;;
            db)        bun run --cwd packages/db test ;;
            *) echo "::error::task=test supports: api dashboard cli desktop core adapters db email (got '${{ inputs.component }}')" ; exit 1 ;;
          esac

  build:
    name: Build ${{ inputs.component }}
    if: inputs.task == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        if: inputs.component == 'cli' || inputs.component == 'desktop'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install AppImage build deps (desktop only)
        if: inputs.component == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build one component
        env:
          NODE_ENV: production
          CLOUD_MODE: "false"
          KRAFT_TARGET: local
          NEXT_PUBLIC_API_PROXY: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          case "${{ inputs.component }}" in
            api)       bun run --cwd apps/api build-release ;;
            dashboard) bun run --cwd apps/dashboard build ;;
            cli)       bun run --cwd apps/cli build:payload ;;
            desktop)   bun run --cwd apps/desktop make ;;
            email)     bun run --cwd apps/email build ;;
            web)       bun run --cwd apps/web build ;;
            *) echo "::error::task=build supports: api dashboard cli desktop email web (core/adapters/db/ui/onboarding resolve to source — nothing to build; got '${{ inputs.component }}')" ; exit 1 ;;
          esac

  docker:
    name: Docker build ${{ inputs.component }} (no push)
    if: inputs.task == 'docker'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}

      - name: Build one image
        run: |
          set -euo pipefail
          case "${{ inputs.component }}" in
            api)       docker build -f apps/api/Dockerfile -t dispatch-api . ;;
            dashboard) docker build -f apps/dashboard/Dockerfile -t dispatch-dashboard . ;;
            edge)      docker build -f apps/edge/Dockerfile -t dispatch-edge . ;;
            mail)      docker build -f apps/email/Dockerfile -t dispatch-mail . ;;
            webmail)   docker build -f apps/email/Dockerfile.webmail -t dispatch-webmail . ;;
            *) echo "::error::task=docker supports: api dashboard edge mail webmail (got '${{ inputs.component }}')" ; exit 1 ;;
          esac

  e2e:
    name: E2E ${{ inputs.task }} (real Docker)
    if: inputs.task == 'e2e-fast' || inputs.task == 'e2e-heavy' || inputs.task == 'e2e-update'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private kraft
        uses: actions/checkout@v7
        with:
          repository: rakay-technology/kraft
          ref: ${{ inputs.ref }}
          token: ${{ secrets.KRAFT_PAT }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the Docker daemon
        run: |
          docker info
          docker version

      - name: Run real-daemon E2E (api only)
        if: inputs.component == 'api'
        env:
          RUN_DOCKER_E2E: "1"
          E2E_SCOPE: ${{ inputs.task == 'e2e-fast' && 'fast' || inputs.task == 'e2e-heavy' && 'heavy' || 'update' }}
          KRAFT_E2E_OLD_VERSION: ${{ inputs.old_version }}
          KRAFT_E2E_NEW_API_IMAGE: ${{ inputs.new_api_image }}
        run: bun run --cwd apps/api test:e2e

      - name: Reject non-api E2E
        if: inputs.component != 'api'
        run: |
          echo "::error::task=${{ inputs.task }} supports only component=api (got '${{ inputs.component }}')"
          exit 1
