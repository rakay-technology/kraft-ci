name: Poll kraft

# The free half of kraft's CI. The private rakay-technology/kraft cannot run any
# Actions job at all — it is out of minutes, so even a two-second dispatcher
# fails with `steps: []` and `runner_id: 0`. That was verified against a
# pre-existing workflow, so it is not a bug in this repo's setup.
#
# So the trigger lives HERE instead, where runners are free. Every few minutes
# this poller asks kraft for the commits it cares about and dispatches the `CI`
# workflow for the ones that have not been tested yet. The heavy work — checkout
# of the private repo, typecheck, format, test, skills — is all in ci.yml and
# runs here too.
#
# Dedup is by SHA and lives in .ci-state/state.json, which is the ONLY file this
# workflow ever commits back. A commit is tested once, pass or fail; a run that
# never reports is re-dispatched after 25 minutes, so a lost run heals on its own
# instead of waiting for the next push.
#
# Nothing here writes to kraft. ci.yml's `report` job owns that side, and this
# workflow reads what it posted.
#
# CAVEAT: GitHub suspends scheduled workflows in a repository with no activity for
# 60 days. This repo is active, so it is fine — but if CI silently stops, check
# Actions → "Poll kraft" for the suspended banner before debugging anything else.

on:
  schedule:
    # Every 5 minutes — GitHub's floor. Runs are free on a public repo, so the
    # only cost of a short interval is how quickly a failure is noticed.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "kraft branch to poll (default main)"
        required: false
        type: string
        default: main

permissions:
  contents: write # commits .ci-state/state.json

concurrency:
  # A poll that overlaps the previous one would double-dispatch. Serialise them.
  group: poll-kraft
  cancel-in-progress: false

jobs:
  poll:
    name: Poll kraft for untested commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout kraft-ci
        uses: actions/checkout@v7

      # KRAFT_PAT already exists here — it is what ci.yml uses to check the
      # private kraft out. Reusing it means no second secret to rotate.
      - name: Poll and dispatch
        env:
          GH_TOKEN: ${{ secrets.KRAFT_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          KRAFT_BRANCH: ${{ inputs.branch || 'main' }}
        run: node scripts/poll-kraft.mjs

      - name: Commit state
        run: |
          set -euo pipefail
          # `git diff --quiet` only sees TRACKED files, and the state file is
          # untracked until its first commit — so this step silently no-op'd on
          # the very run that created it, and the poller lost its memory. Match
          # on porcelain output, which covers modified AND untracked.
          if [ -z "$(git status --porcelain -- .ci-state/state.json)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name  "kraft-ci[bot]"
          git config user.email "kraft-ci[bot]@users.noreply.github.com"
          git add .ci-state/state.json
          # [skip ci] would be meaningless here — CI has no push trigger — but
          # it documents intent and costs nothing if one is ever added.
          git commit -m "chore(ci): record poll results [skip ci]"
          # Rebase onto whatever landed meanwhile rather than failing the tick.
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" \
              && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed — retrying"
            sleep 3
          done
          echo "::warning::could not push state; the next tick will re-derive it"
